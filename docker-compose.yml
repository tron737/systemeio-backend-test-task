services:
    sio_test:
        user: app
        build:
            context: .
            args:
                USER_ID: ${USER_ID:-1000}
        ports:
            - "8337:8337"
        volumes:
            - .:/app:rw
        environment:
            - APP_ENV=dev

    db:
        image: postgres:16
        env_file:
            - .env
        ports:
            - '5432:5432'
        environment:
            POSTGRES_DB: task
            POSTGRES_USER: task
            POSTGRES_PASSWORD: task
        volumes:
            - ./docker/db:/var/lib/postgresql/data

        command: [
            postgres,
            -c, 'max_connections=256',
        ]